<!DOCTYPE html>
<html>
<head>
<title>Career Compass Authentication</title>

<link rel="stylesheet" href="style.css">
<script src="script.js"></script>

</head>

<body>

<div class="auth-container">

<h1>Career Compass</h1>

<div class="tab-buttons">

<button onclick="showSignup()">
Sign Up
</button>

<button onclick="showLogin()">
Login
</button>

</div>

<div id="signupForm">

<h2>Create Account</h2>

<form onsubmit="signup(); return false;">

<input
type="text"
id="signupName"
placeholder="Full Name"
required>

<input
type="email"
id="signupEmail"
placeholder="Email Address"
required>

<input
type="password"
id="signupPassword"
placeholder="Password"
required>

<button type="submit">
Create Account
</button>

</form>

</div>

<div id="loginForm" style="display:none;">

<h2>Login</h2>

<form onsubmit="login(); return false;">

<input
type="email"
id="loginEmail"
placeholder="Email Address"
required>

<input
type="password"
id="loginPassword"
placeholder="Password"
required>

<button type="submit">
Login
</button>

</form>

</div>

</div>

</body>
</html>
