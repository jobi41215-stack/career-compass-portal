<!DOCTYPE html>
<html>
<head>
<title>Student Profile</title>
<link rel="stylesheet" href="style.css">
<script src="script.js"></script>
<script>
if(!localStorage.getItem("loggedInUser")){
    alert("Please sign in first!");
    window.location.href = "auth.html";
}
</script>
</head>
<body> 
<nav class="navbar">

<div class="logo">
<img src="logo1.png" alt="Career Compass Logo">
</div>

<div class="nav-links">
<a href="index.html">Home</a>
<a href="profile.html">Profile</a>
<a href="quiz.html">Career Quiz</a>
<a href="roadmap.html">Roadmap</a>
<a href="courses.html">Courses</a>
<a href="internships.html">Internships</a>
<a href="chatbot.html">AI Bot</a>
</div>

</nav>
<div class="page-container">

<h1 class="page-title">My Profile</h1>

<div class="card">

<label>Name</label>
<input type="text" id="name">

<label>Email</label>
<input type="email" id="email">

<label>Career Interest</label>
<input type="text" id="interest">

<label>Profile Photo</label>
<input type="file" id="photo">

<button onclick="saveProfile()">Save Profile</button>

</div>

<div class="card">

<h2>Saved Profile</h2>

<img id="displayPhoto" width="120">

<p id="displayName"></p>
<p id="displayEmail"></p>
<p id="displayInterest"></p>

<button onclick="showProfile()">
View Profile
</button>

</div>

</div>
<footer>
<p>© 2026 Career Compass Portal</p>
<p>Helping students discover their career path.</p>
</footer>
</body>
</html>
