<!DOCTYPE html>
<html>

<head>
<title>Admin Dashboard</title>
<link rel="stylesheet" href="style.css">
<script src="script.js"></script>
</head>

<body>

<div id="adminLogin" class="form-container">

<h2>Admin Login</h2>

<input type="text" id="adminUser" placeholder="Username">

<input type="password" id="adminPass" placeholder="Password">

<button onclick="adminLogin()">Login</button>

</div>


<div id="adminPanel" style="display:none;">

<h1>Admin Dashboard</h1>

<div class="admin-card">

<h2>📚 Add Course</h2>

<input type="text" id="courseInput" placeholder="Course Name">

<button onclick="addCourse()">Add Course</button>

<ul id="courseList"></ul>

</div>


<div class="admin-card">

<h2>💼 Add Internship</h2>

<input type="text" id="internshipInput" placeholder="Internship Title">

<button onclick="addInternship()">Add Internship</button>

<ul id="internshipList"></ul>

</div>


<div class="admin-card">

<h2>🛣️ Add Roadmap Step</h2>

<input type="text" id="roadmapInput" placeholder="Roadmap Step">

<button onclick="addRoadmap()">Add Step</button>

<ul id="roadmapList"></ul>

</div>


<div class="admin-card">

<h2>❓ Add Quiz Question</h2>

<input type="text" id="quizInput" placeholder="Quiz Question">

<button onclick="addQuizQuestion()">Add Question</button>

<ul id="quizList"></ul>

</div>

</div>

</body>
</html>
